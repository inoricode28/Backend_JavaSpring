<!DOCTYPE html>
<html data-theme="dark" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NewProyect - Carrito de Compras</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <div class="site-header">
            <a href="index.html" class="logo">
                <div class="logo-icon">S</div>
                <span>NewProyect</span>
            </a>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="theme-toggle">
                    <span class="light"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></span>
                    <span class="dark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
                </button>
                <a href="login.html" class="header-btn">🔑 <span>Cuenta</span></a>
            </div>
        </div>
    </header>

    <main class="cart-page">
        <div class="section-title">
            <h2>Carrito de Compras</h2>
            <a href="index.html" class="btn btn-outline">← Seguir Comprando</a>
        </div>
        <div class="cart-layout">
            <div class="cart-items" id="cartItems">
                <div class="loading"><div class="spinner"></div></div>
            </div>
            <div class="cart-summary" id="cartSummary"></div>
        </div>
    </main>

    <div class="modal-overlay" id="paymentModal">
        <div class="modal" id="paymentModalContent"></div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-column">
                <div class="logo" style="margin-bottom:1rem;">
                    <div class="logo-icon">S</div>
                    <span>NewProyect</span>
                </div>
                <p style="color:var(--text-muted);font-size:0.9rem;">Tu tienda de ropa favorita.</p>
            </div>
            <div class="footer-column">
                <h4>Enlaces</h4>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="login.html">Mi Cuenta</a></li>
                    <li><a href="carrito.html">Carrito</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 NewProyect. Todos los derechos reservados.
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/carrito.js"></script>
    <script>
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('mode') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        document.getElementById('themeToggle').addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('mode', newTheme);
        });
        loadCart();
    </script>
</body>
</html>
