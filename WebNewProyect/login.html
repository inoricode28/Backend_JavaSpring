<!DOCTYPE html>
<html data-theme="dark" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NewProyect - Iniciar Sesion</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <div class="site-header">
            <a href="index.html" class="logo">
                <div class="logo-icon">S</div>
                <span>NewProyect</span>
            </a>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="theme-toggle">
                    <span class="light"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></span>
                    <span class="dark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
                </button>
                <a href="carrito.html" class="header-btn">🛒 <span>Carrito</span></a>
            </div>
        </div>
    </header>

    <div class="auth-page">
        <div class="auth-container">
            <div style="text-align:center;margin-bottom:1rem;">
                <div class="logo-icon" style="margin:0 auto;font-size:1.5rem;width:50px;height:50px;">S</div>
            </div>
            <h2>Bienvenido</h2>
            <p class="subtitle">Inicia sesion o crea una cuenta para continuar</p>

            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login" onclick="showLoginTab()">Iniciar Sesion</div>
                <div class="auth-tab" data-tab="register" onclick="showRegisterTab()">Registrarse</div>
            </div>

            <div id="loginMsg"></div>
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="loginUsuario" placeholder="Ingresa tu usuario" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="Ingresa tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:0.9rem;border-radius:10px;">Iniciar Sesion</button>
            </form>

            <div id="regMsg"></div>
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="regUsuario" placeholder="Elige un nombre de usuario" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Crea una contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:0.9rem;border-radius:10px;">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-column">
                <div class="logo" style="margin-bottom:1rem;">
                    <div class="logo-icon">S</div>
                    <span>NewProyect</span>
                </div>
                <p style="color:var(--text-muted);font-size:0.9rem;">Tu tienda de ropa favorita.</p>
            </div>
            <div class="footer-column">
                <h4>Enlaces</h4>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="login.html">Mi Cuenta</a></li>
                    <li><a href="carrito.html">Carrito</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 NewProyect. Todos los derechos reservados.
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const html = document.documentElement;
        const savedTheme = localStorage.getItem('mode') || 'dark';
        html.setAttribute('data-theme', savedTheme);
        document.getElementById('themeToggle').addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('mode', newTheme);
        });

        // Redirect if already logged in
        if (isLoggedIn()) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
